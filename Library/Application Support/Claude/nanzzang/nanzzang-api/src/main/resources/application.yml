spring:
  application:
    name: nanzzang-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:5432/nanzzang_db?sslmode=require}
    username: ${DB_USERNAME:nanzzang}
    password: ${DB_PASSWORD:nanzzang_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: -1
      connection-timeout: 30000
      validation-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 100
        dialect: org.hibernate.dialect.PostgreSQLDialect
        temp:
          use_jdbc_metadata_defaults: false

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
    encoding:
      charset: UTF-8
      force: true
      force-response: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:YOUR_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET:YOUR_CLIENT_SECRET}
            scope:
              - email
              - profile

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

jwt:
  secret: ${JWT_SECRET:uteBFsIy9kgh8wrwNuVO5d6ihd2j5NcUg4nUL3am8gEPpHacoCHLCI5QBX8sxOBp}
  access-token-validity-in-seconds: 900
  refresh-token-validity-in-seconds: 604800

cors:
  allowed-origins: ${FRONTEND_URL:http://localhost:3000}

file:
  upload-dir: ${UPLOAD_DIR:uploads}

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  chat-id: ${TELEGRAM_CHAT_ID:}

app:
  frontend-url: ${FRONTEND_URL:https://nanzzang.vercel.app}

server:
  port: ${PORT:8080}
